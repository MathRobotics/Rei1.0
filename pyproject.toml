[project]
name = "rei"
version = "0.1.0"
description = "Capability-driven numerical problem toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
plotting = [
    "matplotlib>=3.10.8",
]
solver-scipy = [
    "scipy>=1.17.0",
]
solver-cyipopt = [
    "cyipopt>=1.6.1",
]
solver-liteopt = [
    "liteopt>=0.1.9",
]
solvers = [
    "scipy>=1.17.0",
    "cyipopt>=1.6.1",
    "liteopt>=0.1.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rei*"]

[tool.uv.sources]
# Includes cached JIT autodiff Jacobians with batched output lists.
robokots = { git = "https://github.com/MathRobotics/RoboKots.git", rev = "125c8703407fc2863d78df7ad39f5877eefa9de3" }

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "pytest>=9.1.1",
]
plotting = [
    "matplotlib>=3.10.8",
]
kots = [
    "mathrobo>=0.0.3",
    "robokots",
]
pinocchio = [
    "pin>=4.1.0",
]
solver-liteopt = [
    "liteopt>=0.1.9",
]
