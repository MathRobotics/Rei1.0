name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.18
      - run: uv sync --locked --group dev
      - run: uv pip check
      - run: uv pip list
      - run: uv run --locked python -m pytest -q -rs

  robotics:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.18
      - name: Prepare Rust for the pinned RoboKots source build
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: uv sync --locked --group dev --group kots --group pinocchio
      - run: uv pip check
      - run: uv pip list
      - name: Verify native libraries before running integration tests
        run: |
          uv run --locked --group kots --group pinocchio python - <<'PY'
          import platform
          import pinocchio
          import robokots._rust_core
          from robokots.kots import Kots
          print(platform.platform(), platform.python_version())
          print("Pinocchio:", pinocchio.__version__, pinocchio.__file__)
          print("RoboKots Rust:", robokots._rust_core.__file__)
          model = Kots.from_urdf_file("examples/models/planar2.urdf", order=3)
          print("RoboKots model:", type(model).__name__)
          PY
      - name: Run real backend checks without skips
        run: >-
          uv run --locked --group dev --group kots --group pinocchio
          python -m pytest -q -rs --fail-on-skip
          tests/test_kots_operator_doc.py
          tests/test_kots_urdf_json_parity.py
          tests/test_kots_perturbation.py
          tests/test_prepared_trajectory_maps.py
          tests/test_ioc_validation.py
          tests/test_urdf_joint_locking.py
