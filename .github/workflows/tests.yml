name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.18
      - run: uv sync --locked --group dev
      - run: uv pip check
      - run: uv pip list
      - run: uv run --locked python -m pytest -q -rs

  robotics:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.18
      - run: uv sync --locked --group dev --group kots --group pinocchio
      - run: uv pip check
      - run: uv pip list
      - name: Verify Python backends before running integration tests
        run: |
          uv run --no-sync --locked --group kots --group pinocchio python - <<'PY'
          import platform
          import pinocchio
          from robokots.kots import Kots
          print(platform.platform(), platform.python_version())
          print("Pinocchio:", pinocchio.__version__, pinocchio.__file__)
          model = Kots.from_urdf_file("examples/models/planar2.urdf", order=3, backend="numpy")
          print("RoboKots model:", type(model).__name__)
          PY
      - name: Run portable robotics checks without skips
        run: >-
          uv run --no-sync --locked --group dev --group kots --group pinocchio
          python -m pytest -q -rs --fail-on-skip -k 'not rust'
          tests/test_kots_perturbation.py
          tests/test_ioc_validation.py
          tests/test_urdf_joint_locking.py
          tests/test_kots_compile_order.py
          tests/test_model_file_spec.py
          tests/test_prepared_trajectory_maps.py
          tests/test_trajectory_example_cli.py
      - name: Run NumPy variants in modules containing native-only checks
        run: >-
          uv run --no-sync --locked --group dev --group kots --group pinocchio
          python -m pytest -q -rs --fail-on-skip -k numpy
          tests/test_kots_urdf_json_parity.py
          tests/test_kots_autodiff_batch.py
