# Both hands locked: left arm joints 1..7, then right arm joints 1..7.
[model.locked_joints]
# 直動関節の固定位置 [m]。mimic追従指も自動的に固定されます。
left_fr3v2_finger_joint1 = 0.02
right_fr3v2_finger_joint1 = 0.02

[time]
N = 200    # 区間数（評価点は N + 1）
dt = 0.01  # 秒

[trajectory]
type = "bspline"
degree = 5
num_ctrl_points = 50

[opt_vals.trajectory_params]
init = { fill = 0.0 }

# 境界条件
[[terms]]
name = "q_boundary"
quantity = "joint_angles"
at = [
  { time = "first", target = [0, -0.4, 0, -1.8, 0, 1.4, 0, 0, -0.4, 0, -1.8, 0, 1.4, 0] },
  { time = "last", target = [0.3, -0.2, 0.2, -1.5, 0.1, 1.6, 0.2, -0.3, -0.2, -0.2, -1.5, -0.1, 1.6, -0.2] },
]
kind = "eq"
enforce = "nullspace"
weight = 100.0
plot = "joint_q"

[[terms]]
name = "qdot_boundary"
quantity = "joint_velocities"
at = [
  { time = "first", target = { fill = 0.0 } },
  { time = "last", target = { fill = 0.0 } },
]
kind = "eq"
enforce = "nullspace"
weight = 100.0

# 全時刻の関節角制限
[[terms]]
name = "joint_q_bounds"
quantity = "joint_angles"
over = "all"
bounds = { lower = [-2.90074, -1.83609, -2.90074, -3.07702, -2.8763, 0.439823, -3.05083, -2.90074, -1.83609, -2.90074, -3.07702, -2.8763, 0.439823, -3.05083], upper = [2.90074, 1.83609, 2.90074, -0.116938, 2.8763, 4.62163, 3.05083, 2.90074, 1.83609, 2.90074, -0.116938, 2.8763, 4.62163, 3.05083] }
kind = "ineq"
weight = 1e5

# 全時刻の正則化（量の二乗和を小さくする）
[[terms]]
name = "qdot_traj_regularization"
quantity = "joint_velocities"
over = "all"
weight = 1e-4

[[terms]]
name = "qddot_traj_regularization"
quantity = "joint_accelerations"
over = "all"
weight = 1e-4

[[terms]]
name = "torque_traj_regularization"
quantity = "joint_torques"
over = "all"
weight = 1e-10
plot = "joint_torque"
