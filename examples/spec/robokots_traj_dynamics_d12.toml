[time]
N = 200    # 区間数（評価点は N + 1）
dt = 0.01  # 秒

[trajectory]
type = "bspline"
degree = 5
num_ctrl_points = 50

[opt_vals.trajectory_params]
init = { fill = 0.0 }

# 境界条件
[[terms]]
name = "q_boundary"
quantity = "joint_angles"
at = [
  { time = "first", target = { fill = 1.57 } },
  { time = "last", target = { fill = -1.57 } },
]
kind = "eq"
enforce = "nullspace"
weight = 100.0
plot = "joint_q"

[[terms]]
name = "qdot_boundary"
quantity = "joint_velocities"
at = [
  { time = "first", target = { fill = 0.0 } },
  { time = "last", target = { fill = 0.0 } },
]
kind = "eq"
enforce = "nullspace"
weight = 100.0

# 全時刻の関節角制限
[[terms]]
name = "joint_q_bounds"
quantity = "joint_angles"
over = "all"
bounds = { lower = { fill = -3.14159 }, upper = { fill = 3.14159 } }
kind = "ineq"
weight = 1e5

# 全時刻の正則化（量の二乗和を小さくする）
[[terms]]
name = "qdot_traj_regularization"
quantity = "joint_velocities"
over = "all"
weight = 1e-4

[[terms]]
name = "qddot_traj_regularization"
quantity = "joint_accelerations"
over = "all"
weight = 1e-4

[[terms]]
name = "torque_traj_regularization"
quantity = "joint_torques"
over = "all"
weight = 1e-10
plot = "joint_torque"
